# Custom Domain Routing
# Supports any domain length or IP address!
server:
  api_host: "arc-api.example.com:custom_port"
  auth_host: "custom_domain:8080"

# Custom Package & App Name (Optional)
# Change the APK package name and display label to install alongside the original app
package_name: "moe.ext.arc"
app_name: "Arcaea Ext"

features:
  # Expose Internal App Data via Storage Access Framework
  expose_internal_data: false

# Custom Signing Configuration
# If the keystore does not exist, a debug keystore will be generated automatically.
signing:
  keystore: "debug.keystore"
  alias: "androiddebugkey"
  keystore_password: "android"
  key_password: "android"
